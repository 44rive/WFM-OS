name: Repository guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject runtime data and temporary Excel files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files \
            '03_Data/**' \
            '04_Outputs/**' \
            '05_Backups/**' \
            '~$*' | grep -v '/README.md$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden runtime artifacts are tracked:"
            echo "$forbidden"
            exit 1
          fi
      - name: Compile Python source
        run: python -m compileall -q 90_Source_Code/03_Python 91_Tests tools
      - name: Run anonymized contract tests
        run: python -m unittest discover -s 91_Tests -p 'test_*.py'
      - name: Install workbook build dependency
        run: python -m pip install --requirement requirements-build.txt
      - name: Validate committed workbook and provenance
        run: python tools/validate_workbook.py
