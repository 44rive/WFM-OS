name: Repository guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject runtime data and temporary Excel files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files \
            '03_Data/**' \
            '04_Outputs/**' \
            '05_Backups/**' \
            '~$*' | grep -v '/README.md$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden runtime artifacts are tracked:"
            echo "$forbidden"
            exit 1
          fi
      - name: Compile Python source
        run: python -m compileall -q 90_Source_Code/03_Python 91_Tests tools
      - name: Run anonymized contract tests
        run: python -m unittest discover -s 91_Tests -p 'test_*.py'
      - name: Install workbook build dependency
        run: python -m pip install --requirement requirements-build.txt
      - name: Rebuild committed workbook from recorded provenance
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(python -c 'import json; print(json.load(open("01_Application/BUILD_PROVENANCE.json"))["build_date"])')"
          git_commit="$(python -c 'import json; print(json.load(open("01_Application/BUILD_PROVENANCE.json"))["git_commit"])')"
          release="$(python -c 'import json; print(json.load(open("01_Application/BUILD_PROVENANCE.json"))["release"])')"
          python tools/build_workbook.py \
            --output /tmp/WFM_OS.xlsx \
            --build-date "$build_date" \
            --git-commit "$git_commit" \
            --version "$release"
          cmp --silent 01_Application/WFM_OS.xlsx /tmp/WFM_OS.xlsx
      - name: Validate committed workbook structure and provenance
        run: python tools/validate_workbook.py
